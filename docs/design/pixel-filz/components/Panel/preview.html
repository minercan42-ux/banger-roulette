<!doctype html>
<html lang="de" data-theme="felt">
  <head>
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../../components.css" />
    <meta charset="utf-8" />
    <title>Panel</title>
  </head>
  <body class="br-stage">
    <div class="br-row" style="align-items: stretch">
      <section class="br-panel" style="flex: 1 1 240px">
        <h3 class="br-panel__title">Spielregeln</h3>
        <p style="margin: 0">5 Runden · 90 s Auswahl · 40 s Clip</p>
        <p class="br-read" style="margin: 8px 0 0">
          Nur der Host kann die Regeln ändern.
        </p>
      </section>
      <section class="br-panel" style="flex: 1 1 200px">
        <div class="br-label">Mulde</div>
        <div class="br-panel br-panel--well" style="margin-top: 8px">
          <span style="color: var(--gold); font-size: 26px">ABCDEF</span>
          <span class="br-read" style="display: block">Raumcode</span>
        </div>
      </section>
    </div>
  </body>
</html>
