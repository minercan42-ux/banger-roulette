<!doctype html>
<html lang="de" data-theme="felt">
  <head>
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../../components.css" />
    <meta charset="utf-8" />
    <title>Button</title>
  </head>
  <body class="br-stage">
    <div class="br-stack">
      <div class="br-row">
        <button class="br-btn">Setzen!</button>
        <button class="br-btn br-btn--blue">Nochmal hören</button>
        <button class="br-btn br-btn--red">Genre-Fail</button>
        <button class="br-btn br-btn--slate">Abbrechen</button>
      </div>
      <div class="br-row">
        <button class="br-btn br-btn--sm">Kopieren</button>
        <button class="br-btn br-btn--sm br-btn--blue">+1 s</button>
        <button class="br-btn br-btn--sm br-btn--red is-on" aria-pressed="true">
          Genre-Fail gesetzt
        </button>
        <button class="br-btn" disabled>Starten (3/3 nötig)</button>
      </div>
    </div>
  </body>
</html>
