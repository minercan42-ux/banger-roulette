<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2306231a' stroke='%23d4af37' stroke-width='3'/%3E%3C/svg%3E"
    />
    <!-- The two pixel faces of the first paint. Without the preload the browser
         discovers them only after the app rendered, and the swap from the
         fallback face reflows the panel (CLS on the room route, #53). -->
    <link
      rel="preload"
      href="/fonts/Jersey10-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Silkscreen-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Banger Roulette</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
