name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size:check

  # The PR E2E run is split across parallel jobs (Playwright sharding, see
  # https://playwright.dev/docs/test-sharding). `e2e` below is the aggregate
  # check that keeps the pre-sharding name `E2E (Playwright)`.
  e2e-shard:
    name: E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }} (chromium)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    env:
      PW_BLOB_REPORT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-shard-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1

  # Production-CSP suite: runs once per PR, not per shard.
  e2e-csp:
    name: E2E production CSP (chromium)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PW_BLOB_REPORT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:csp
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-csp
          path: blob-report/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    # Runs even when a shard failed so the merged report exists, then fails
    # itself unless every shard and the CSP suite succeeded.
    if: ${{ !cancelled() }}
    needs: [e2e-shard, e2e-csp]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      # `list` prints every test once plus the total, which doubles as the
      # "each test ran exactly once" evidence in the log.
      - run: pnpm exec playwright merge-reports --reporter=list,html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Fail unless every shard and the CSP suite passed
        if: ${{ needs.e2e-shard.result != 'success' || needs.e2e-csp.result != 'success' }}
        run: |
          echo "e2e-shard: ${{ needs.e2e-shard.result }}, e2e-csp: ${{ needs.e2e-csp.result }}"
          exit 1

  lighthouse:
    name: Lighthouse (desktop >= 90, mobile >= 80)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the Chromium that Lighthouse drives
        id: chrome
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "path=$(pnpm exec node -e "console.log(require(require.resolve('playwright-core',{paths:[require.resolve('@playwright/test')]})).chromium.executablePath())")" >> "$GITHUB_OUTPUT"
      - run: pnpm lighthouse
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: lhci/
          retention-days: 7

  e2e-cross-browser:
    name: E2E cross-browser (${{ matrix.browser }})
    # NFR-05: pull requests stay Chromium-only (Actions minute budget).
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
